[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tvdatafeed"
version = "2.2.0"
description = "TradingView historical data downloader (timezone-safe fork)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT License" }
authors = [
    { name = "@StreamAlpha" },
]
keywords = ["tradingview", "ohlc", "candles", "market-data", "finance"]
dependencies = [
    "pandas>=1.3",
    "websocket-client>=0.57",
    "requests>=2.20",
]

[project.urls]
Source = "https://github.com/ayoubajermoune/tvdatafeed-timezone-fix"

[tool.setuptools]
packages = ["tvDatafeed"]
